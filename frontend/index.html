<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Run league nights, score courts, and keep pickleball ladder rankings." />
  <title>PickleRank</title>

  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PickleRank" />
  <meta name="theme-color" content="#f6f8fa" />
  <!-- Apply the saved theme preference before the bundle loads (no flash).
       Kept in sync afterwards by src/stores/theme.ts; colors match src/styles/tokens.css. -->
  <script>
    (function () {
      var theme = 'light'
      try {
        var pref = localStorage.getItem('pr-theme')
        theme = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
      } catch (e) { /* default to light: daylight courts */ }
      document.documentElement.dataset.theme = theme
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1b2d' : '#f6f8fa')
    })()
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
