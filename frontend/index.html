<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Pickleball Event Matchmaking & Ranking Platform" />
  <title>PickleRank - Matchmaking & Rankings</title>

  <!-- Apple iOS Meta Tags -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PickleRank" />
  <meta name="theme-color" content="#0f172a" />

  <!-- Apply theme before the bundle loads to avoid a flash of the wrong theme.
       Kept in sync afterwards by the theme store (src/stores/theme.ts). -->
  <script>
    (function () {
      var theme = 'dark'
      try {
        var pref = localStorage.getItem('pr-theme')
        theme = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'dark' : 'light'
      } catch (e) { /* default to dark */ }
      document.documentElement.dataset.theme = theme
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#f8fafc')
    })()
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
